<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Practical 7 · Student registration</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="form-card">
    <a class="back-link" href="../../index.php">← StudentHub</a>
    <p class="eyebrow">WEB DEVELOPMENT FRAMEWORKS · PRACTICAL 7</p>
    <h1>Student registration</h1>
    <p class="intro">Enter your details to register for a course.</p>
    <form method="POST" action="php-registration.php">
      <label for="name">Full name</label>
      <input id="name" name="name" type="text" autocomplete="name" maxlength="100" required>

      <label for="email">Email address</label>
      <input id="email" name="email" type="email" autocomplete="email" maxlength="254" required>

      <label for="mobile">Mobile number</label>
      <input id="mobile" name="mobile" type="tel" inputmode="numeric" autocomplete="tel" maxlength="20" placeholder="10-digit mobile number" required>

      <label for="course">Course</label>
      <select id="course" name="course" required>
        <option value="">Select a course</option>
        <option value="B.Tech">B.Tech</option>
        <option value="BCA">BCA</option>
        <option value="B.Sc">B.Sc</option>
      </select>

      <label for="message">Message</label>
      <textarea id="message" name="message" rows="4" maxlength="1000" required></textarea>

      <button type="submit">Submit registration <span aria-hidden="true">→</span></button>
    </form>
    <p class="storage-note">This practical stores valid submissions in the project’s <code>data/registrations.csv</code> file.</p>
  </main>
</body>
</html>
